name: Test
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: npm install

      # Generates the TeaVM JS (src/generated/*.teavm.js) plus the esbuild bundles. custom-auth's
      # Gradle build has no io.github.intisy:ai-java dependency, but the token env is set for
      # consistency with the other providers (harmless when unused).
      - run: npm run build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - run: npx vitest run

      - run: chmod +x java/gradlew

      - name: Gradle tests
        working-directory: java
        run: ./gradlew test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
