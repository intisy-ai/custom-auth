import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // teavm transpiles :ir's + :custom's pure types -- no gson/net/nio/etc, matching
    // their own zero-dependency policy.
    githubImplementation "intisy-ai:basekit:4.3.0:ir"
    implementation project(":custom")
    // SOURCE-retention, so nothing here reaches the bundle. The processor jar is a release asset and
    // carries no transitive metadata, so the annotation types it reads are named beside it.
    githubCompileOnly "intisy:bayonet:1.7.0:annotations"
    githubAnnotationProcessor "intisy:bayonet:1.7.0:processor"
    githubAnnotationProcessor "intisy:bayonet:1.7.0:annotations"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :ir/:openai/:custom. TeaVM 0.15.0's own classlib/
// jso-apis/extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so
// :teavm-custom needs a newer compile target -- override both the extension's compatibility
// (fixes Gradle's dependency-resolution JVM-version attribute matching) and the compileJava
// task's --release option. Mirrors openai-translator's teavm-openai/build.gradle exactly.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
    // Emits the .d.ts for this bundle's exports, so the TypeScript seam is typed against the Java
    // rather than against a copy of it someone kept in step by hand.
    options.compilerArgs << "-Atsemit.name=custom-provider.teavm"
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.CustomProviderJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "custom-provider.js"
}
